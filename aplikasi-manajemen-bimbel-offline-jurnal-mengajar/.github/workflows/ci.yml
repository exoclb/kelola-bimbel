# Pipa CI otomatis: setiap push dan pull request diperiksa di sini, supaya yang
# rusak ketahuan sebelum rilis — bukan sesudah pengguna menemukannya.
#
# Dipisah dua job supaya uji peramban tidak menahan pemeriksaan yang murah,
# lalu ditutup satu job ringkasan yang merangkum hasil keduanya:
#   - `check`: langkah statis dan uji unit/integrasi, tanpa peramban.
#   - `e2e`: build produksi lalu seluruh skenario peramban, dan hanya berjalan
#     kalau `check` sudah lulus.
#   - `ringkasan`: selalu jalan (walau ada job yang gagal), menuliskan tabel
#     hasil kelima langkah ke halaman jalan, lalu menggagalkan pipa kalau ada
#     job yang tidak lulus.
#
# Urutan dan perintah langkahnya sengaja sama dengan `PEMERIKSAAN_CI` di
# `src/lib/ci-otomatis.ts`: halaman Pengaturan → Status CI membacakan daftar itu,
# dan `tests/ci-otomatis.test.mjs` menjaga kedua berkas tetap sejalan. Menambah
# langkah di sini berarti menambahkannya di sana juga.
#
# Uji unit dan uji peramban sama-sama menjalankan PostgreSQL sekali pakai dari
# `compose.test.yaml` (`scripts/test.mjs`), jadi tidak ada uji yang menyentuh
# database aplikasi.
name: CI otomatis

on:
  push:
  pull_request:

permissions:
  contents: read

# Push yang menyusul tidak perlu mengantre di belakang jalan yang sudah usang:
# yang sedang berjalan dibatalkan supaya hasilnya selalu tentang commit terbaru.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Pemeriksaan kode & uji otomatis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Penyiapan: dependensi terkunci, berkas lingkungan dan kunci auth, lalu
      # database diperiksa `npm run doctor` sebelum langkah berikutnya jalan.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run setup

      # Lint, pemeriksaan tipe, lalu seluruh uji unit dan integrasi. Langkah
      # terlama dan yang paling sering menangkap kesalahan.
      - run: npm run check

      # Tata tulisan seluruh berkas menurut Prettier.
      - run: npm run format:check

  e2e:
    name: Uji peramban (Playwright)
    # Pemeriksaan yang gagal sudah cukup untuk menghentikan rilis, jadi job
    # peramban tidak perlu dijalankan setelahnya.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Job ini berjalan di mesin baru, jadi penyiapannya diulang. Hasil build
      # juga tidak dibagi antar job: `.next` memuat jalur absolut mesin yang
      # membuatnya tidak aman dipindahkan, lebih baik di-build di sini.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run setup

      # Build produksi: impor atau tipe yang belum tersentuh uji ikut ketahuan.
      # Hasil build inilah yang dilayani `next start` pada uji peramban.
      - run: npm run build

      # Skenario peramban di atas basis data uji sekali pakai. Runner belum
      # punya perambannya, jadi Chromium dipasang lebih dulu.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # Kalau ada yang gagal, bukti dan laporannya disimpan 7 hari supaya bisa
      # diperiksa tanpa menjalankan ulang pipanya. `test-results` memuat
      # tangkapan layar dan jejak langkah (trace), `playwright-report` memuat
      # laporan HTML yang bisa dibuka langsung dari berkas artefaknya.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: laporan-uji-peramban
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  ringkasan:
    name: Ringkasan hasil CI
    # Tanpa `always()` job ini ikut dilewati saat ada yang gagal — justru saat
    # itulah ringkasannya paling dibutuhkan.
    if: always()
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Susun ringkasan hasil
        env:
          HASIL_PEMERIKSAAN: ${{ needs.check.result }}
          HASIL_PERAMBAN: ${{ needs.e2e.result }}
        run: |
          # Hasil GitHub (success/failure/cancelled/skipped) diterjemahkan ke
          # kata yang sama dengan keadaan pemeriksaan di halaman Status CI.
          arti() {
            case "$1" in
              success) echo "lulus" ;;
              failure) echo "gagal" ;;
              cancelled) echo "dibatalkan" ;;
              skipped) echo "dilewati" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "## Ringkasan CI otomatis"
            echo ""
            if [ "$HASIL_PEMERIKSAAN" = "success" ] && [ "$HASIL_PERAMBAN" = "success" ]; then
              echo "**Lulus.** Seluruh langkah pipa selesai, jadi commit ini boleh dilanjutkan ke rilis."
            else
              echo "**Gagal.** Jangan rilis dulu: perbaiki langkah yang merah, push lagi, lalu pastikan jalan barunya lulus."
            fi
            echo ""
            echo "| Langkah | Perintah | Job | Hasil |"
            echo "| --- | --- | --- | --- |"
            echo "| Penyiapan proyek | \`npm run setup\` | check, e2e | $(arti "$HASIL_PEMERIKSAAN") |"
            echo "| Pemeriksaan kode & uji otomatis | \`npm run check\` | check | $(arti "$HASIL_PEMERIKSAAN") |"
            echo "| Format berkas | \`npm run format:check\` | check | $(arti "$HASIL_PEMERIKSAAN") |"
            echo "| Build produksi | \`npm run build\` | e2e | $(arti "$HASIL_PERAMBAN") |"
            echo "| Uji end-to-end (Playwright) | \`npm run test:e2e\` | e2e | $(arti "$HASIL_PERAMBAN") |"
            echo ""
            echo "Penyiapan dijalankan di kedua job, jadi barisnya mengikuti job \`check\`. Nama dan perintah langkah di tabel ini sama dengan daftar baku di \`src/lib/ci-otomatis.ts\` yang dibacakan halaman Pengaturan → Status CI."
          } >> "$GITHUB_STEP_SUMMARY"

      # Pipa sudah merah sendiri kalau ada job yang gagal, tapi menutupnya di
      # sini membuat satu tempat saja yang perlu diperiksa: job ringkasan.
      - name: Hentikan pipa kalau ada job yang tidak lulus
        if: needs.check.result != 'success' || needs.e2e.result != 'success'
        run: |
          echo "::error::CI belum lulus: check=${{ needs.check.result }}, e2e=${{ needs.e2e.result }}"
          exit 1
